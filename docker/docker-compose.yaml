services:
  ocr_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Keys are injected at run time, never baked into the image, so the image
    # is safe to publish to a registry.
    env_file:
      - ../transcription/.env
    ports:
      - "8080:8080"
    networks:
      - symbiota-network

networks:
  symbiota-network:
    external: true
